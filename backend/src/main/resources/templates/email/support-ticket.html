<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Support Ticket</title>
  <style>
    body { margin: 0; padding: 0; background: #f4f6f9; font-family: 'Segoe UI', Arial, sans-serif; }
    .wrapper { max-width: 600px; margin: 30px auto; background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .header { background: linear-gradient(135deg, #002046, #003a80); padding: 36px 32px; text-align: center; }
    .header h1 { color: #ffffff; margin: 0; font-size: 24px; font-weight: 700; }
    .header p { color: rgba(255,255,255,0.75); margin: 6px 0 0; font-size: 14px; }
    .body { padding: 32px; }
    .detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
    .label { color: #888; }
    .value { font-weight: 600; color: #222; }
    .message-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px 20px; margin: 20px 0; font-size: 14px; color: #374151; line-height: 1.6; }
    .footer { background: #f8fafc; padding: 20px 32px; text-align: center; font-size: 12px; color: #999; border-top: 1px solid #f0f0f0; }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <h1>Support Ticket Received</h1>
    <p>TripGo Support Team</p>
  </div>
  <div class="body">
    <p style="font-size:15px;color:#333;margin-bottom:24px;">A new support request has been submitted.</p>
    <div class="detail-row">
      <span class="label">From</span>
      <span class="value" th:text="${firstName + ' &lt;' + userEmail + '&gt;'}"></span>
    </div>
    <div class="detail-row">
      <span class="label">Category</span>
      <span class="value" th:text="${category}"></span>
    </div>
    <div class="detail-row">
      <span class="label">Subject</span>
      <span class="value" th:text="${subject}"></span>
    </div>
    <p style="font-size:13px;font-weight:600;color:#555;margin:20px 0 8px;">Message</p>
    <div class="message-box" th:text="${message}"></div>
    <p style="font-size:13px;color:#777;margin-top:20px;">Reply directly to <strong th:text="${userEmail}"></strong> to respond to this ticket.</p>
  </div>
  <div class="footer">
    &copy; 2025 TripGo. All rights reserved.
  </div>
</div>
</body>
</html>
