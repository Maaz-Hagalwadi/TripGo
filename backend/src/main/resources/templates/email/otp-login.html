<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your TripGo Login OTP</title>
  <style>
    body { margin: 0; padding: 0; background: #f4f6f9; font-family: 'Segoe UI', Arial, sans-serif; }
    .wrapper { max-width: 600px; margin: 30px auto; background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .header { background: linear-gradient(135deg, #0B1F3A, #1a3a6b); padding: 36px 32px; text-align: center; }
    .header h1 { color: #ffffff; margin: 0; font-size: 26px; font-weight: 700; }
    .header p { color: rgba(255,255,255,0.75); margin: 6px 0 0; font-size: 14px; }
    .body { padding: 40px 32px; color: #333; }
    .otp-box { background: #f0f4ff; border: 2px dashed #0B1F3A; border-radius: 12px; padding: 28px; text-align: center; margin: 28px 0; }
    .otp-label { font-size: 13px; color: #64748b; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; margin-bottom: 12px; }
    .otp-code { font-size: 42px; font-weight: 800; letter-spacing: 0.25em; color: #0B1F3A; font-family: 'Courier New', monospace; }
    .expiry { font-size: 13px; color: #64748b; margin-top: 12px; }
    .warning { background: #fff8ec; border-left: 4px solid #f59e0b; padding: 12px 16px; border-radius: 4px; font-size: 13px; color: #92400e; margin-top: 24px; }
    .footer { background: #f4f6f9; padding: 24px 32px; text-align: center; font-size: 12px; color: #999; border-top: 1px solid #eee; }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <h1>🚌 TripGo</h1>
    <p>One-Time Password</p>
  </div>
  <div class="body">
    <p>Hi <strong th:text="${firstName}">Traveller</strong>,</p>
    <p>Use the OTP below to log in to your TripGo account. Do not share this code with anyone.</p>

    <div class="otp-box">
      <div class="otp-label">Your Login OTP</div>
      <div class="otp-code" th:text="${otpCode}">000000</div>
      <div class="expiry">Expires in <strong th:text="${expiryMinutes}">10</strong> minutes</div>
    </div>

    <div class="warning">
      If you did not request this OTP, please ignore this email. Your account is safe.
    </div>
  </div>
  <div class="footer">
    <p>© 2026 TripGo. All rights reserved.</p>
  </div>
</div>
</body>
</html>
